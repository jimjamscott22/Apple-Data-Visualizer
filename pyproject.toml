[project]
name = "apple-data-visualizer"
version = "0.1.0"
description = "Apple Health desktop visualizer built with PySide6"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "PySide6>=6.7",
    "pyqtgraph>=0.13",
    "PyMySQL>=1.1",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
apple-data-visualizer = "app.main:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
